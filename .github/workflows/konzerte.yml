name: Konzerte pruefen

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - name: Repository holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bibliotheken installieren
        run: pip install requests beautifulsoup4

      - name: Konzerte pruefen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python konzerte.py

      - name: Stand speichern
        if: always()
        run: |
          git config user.name "konzert-bot"
          git config user.email "konzert-bot@users.noreply.github.com"
          for f in known_events.json events.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet || (git commit -m "Termine aktualisiert" && git pull --rebase origin main && git push)

      - name: Zeitplan aktiv halten
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable konzerte.yml --repo "$GITHUB_REPOSITORY" || true

      - name: Monatliches Lebenszeichen
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            curl -s -o /dev/null -H "Title: Konzertkalender laeuft" -d "Der taegliche Abruf ist aktiv. Naechste Meldung am 1. des naechsten Monats." "https://ntfy.sh/$NTFY_TOPIC"
          fi
