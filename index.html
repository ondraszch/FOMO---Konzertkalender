<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#121212">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Konzertkalender</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #121212;
    --card: #1c1c1c;
    --line: #2e2e2e;
    --text: #ececec;
    --muted: #9b9b9b;
    --accent: #e8553d;
    --new: #3ba55d;
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: 8px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 12px 12px 40px; }
  h1 { font-size: 1.4rem; margin: 8px 0 2px; }
  .stand { color: var(--muted); font-size: .85rem; margin-bottom: 12px; }
  .controls {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    padding: 8px 0 10px;
    border-bottom: 1px solid var(--line);
  }
  .controls input[type=search] {
    width: 100%; padding: 10px 12px; margin-bottom: 8px;
    background: var(--card); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; font: inherit;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    padding: 6px 12px; border-radius: 999px; cursor: pointer;
    background: var(--card); color: var(--text);
    border: 1px solid var(--line); font: inherit; font-size: .9rem;
  }
  .chip[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip.off { opacity: .45; }
  .count { color: var(--muted); font-size: .85rem; margin: 10px 0 0; }
  h2 {
    font-size: .95rem; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 22px 0 8px;
  }
  .ev {
    display: flex; gap: 12px; padding: 10px 12px; margin-bottom: 8px;
    background: var(--card); border: 1px solid var(--line);
    border-left: 4px solid var(--line); border-radius: 8px;
  }
  .ev.hit { border-left-color: var(--accent); }
  .date { min-width: 46px; text-align: center; line-height: 1.1; }
  .dow { display: block; font-size: .75rem; color: var(--muted); text-transform: uppercase; }
  .day { display: block; font-size: 1.5rem; font-weight: 700; }
  .mon { display: block; font-size: .75rem; color: var(--muted); }
  .info { min-width: 0; flex: 1; }
  .title { font-weight: 600; overflow-wrap: anywhere; }
  a.title { color: var(--text); text-decoration: none; }
  a.title:hover, a.title:focus { text-decoration: underline; }
  .detail {
    color: var(--muted); font-size: .85rem; margin-top: 2px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; font-size: .78rem; }
  .tag { padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .tag.hit { border-color: var(--accent); color: var(--accent); }
  .tag.new { border-color: var(--new); color: var(--new); }
  .tag.cancel { border-color: #c0392b; color: #e57368; }
  .ev.cancelled .title { text-decoration: line-through; color: var(--muted); }
  .ev.cancelled { opacity: .7; }
  .tag.sold { border-color: #c79a2b; color: #d9b04a; }
  details.card { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 2px; }
  details.card summary {
    cursor: pointer; color: var(--muted); font-size: .85rem;
    list-style: none; padding: 8px 0 4px;
  }
  details.card summary::-webkit-details-marker { display: none; }
  details.card summary::before { content: "\25B8  "; }
  details.card[open] summary::before { content: "\25BE  "; }
  .card-body { font-size: .88rem; display: grid; gap: 10px; padding-top: 4px; }
  .lineup { list-style: none; margin: 0; padding: 0; }
  .lineup li { padding: 2px 0; }
  .lineup .lu-info { color: var(--muted); }
  .facts { color: var(--text); }
  .facts span { display: inline-block; margin-right: 12px; }
  .btn {
    display: inline-block; padding: 6px 12px; margin: 0 6px 6px 0;
    border: 1px solid var(--line); border-radius: 999px;
    color: var(--text); text-decoration: none; font-size: .85rem;
  }
  .btn.primary { border-color: var(--accent); color: var(--accent); }
  .tabs { display: flex; gap: 6px; margin: 4px 0 10px; }
  .tab {
    flex: 1; padding: 9px 12px; cursor: pointer; font: inherit; font-size: .95rem;
    background: var(--card); color: var(--muted);
    border: 1px solid var(--line); border-radius: 8px;
  }
  .tab[aria-pressed=true] { color: var(--text); border-color: var(--accent); }
  .panel[hidden] { display: none; }
  .radar-intro { color: var(--muted); font-size: .88rem; margin: 6px 0 12px; }
  .band {
    display: flex; align-items: center; gap: 10px; justify-content: space-between;
    padding: 10px 12px; margin-bottom: 8px; background: var(--card);
    border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 8px;
  }
  .band.has { border-left-color: var(--accent); }
  .band .bname { font-weight: 600; overflow-wrap: anywhere; }
  .band .bmeta { color: var(--muted); font-size: .82rem; margin-top: 2px; }
  .words { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 12px; }
  .addrow { display: flex; gap: 8px; margin: 0 0 8px; }
  .addrow input {
    flex: 1; min-width: 0; padding: 10px 12px; font: inherit;
    background: var(--card); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px;
  }
  .small { color: var(--muted); font-size: .82rem; min-height: 1.2em; margin: 0 0 10px; }
  button.btn { background: transparent; font: inherit; font-size: .85rem; cursor: pointer; }
  .tag.local { border-style: dashed; white-space: nowrap; font-weight: 400; font-size: .72rem; }
  .band .actions { display: flex; gap: 6px; flex-shrink: 0; }
  .msg { color: var(--muted); padding: 24px 4px; }
  footer { color: var(--muted); font-size: .78rem; margin-top: 28px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Konzertkalender</h1>
  <div class="stand"
